<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Sans TC',sans-serif">
  <rect width="900" height="280" fill="#0f1117"/>

  <!-- left: two source sheets -->
  <g>
    <rect x="40" y="50" width="190" height="80" rx="12" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
    <rect x="58" y="66" width="18" height="22" rx="3" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <line x1="58" y1="73" x2="76" y2="73" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="58" y1="80" x2="76" y2="80" stroke="#22c55e" stroke-width="1.5"/>
    <text x="90" y="82" fill="#e2e8f0" font-size="14" font-weight="700">師資調查表</text>
    <text x="58" y="112" fill="#8894b0" font-size="12">Google Sheet</text>

    <rect x="40" y="150" width="190" height="80" rx="12" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
    <rect x="58" y="166" width="18" height="22" rx="3" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <line x1="58" y1="173" x2="76" y2="173" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="58" y1="180" x2="76" y2="180" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="90" y="182" fill="#e2e8f0" font-size="14" font-weight="700">需求表</text>
    <text x="58" y="212" fill="#8894b0" font-size="12">Google Sheet</text>
  </g>

  <!-- arrows -->
  <line x1="230" y1="90" x2="330" y2="140" stroke="#4a5680" stroke-width="2"/>
  <line x1="230" y1="190" x2="330" y2="140" stroke="#4a5680" stroke-width="2"/>
  <polygon points="330,140 318,133 318,147" fill="#4a5680"/>

  <!-- middle: share dialog mockup -->
  <g>
    <rect x="335" y="40" width="300" height="200" rx="14" fill="#1e2336" stroke="#3a4570" stroke-width="1.5"/>
    <text x="355" y="70" fill="#e2e8f0" font-size="15" font-weight="700">共用設定</text>

    <text x="355" y="102" fill="#8894b0" font-size="12">一般access</text>
    <rect x="355" y="110" width="260" height="40" rx="8" fill="#181c27" stroke="#4f8ef7" stroke-width="2"/>
    <circle cx="374" cy="130" r="8" fill="none" stroke="#4f8ef7" stroke-width="2"/>
    <line x1="380" y1="136" x2="386" y2="142" stroke="#4f8ef7" stroke-width="2"/>
    <text x="398" y="135" fill="#e2e8f0" font-size="12.5" font-weight="600">知道連結的使用者</text>
    <circle cx="600" cy="130" r="7" fill="#4f8ef7"/>
    <circle cx="600" cy="130" r="3" fill="#181c27"/>

    <text x="355" y="172" fill="#8894b0" font-size="12">角色</text>
    <rect x="355" y="180" width="260" height="36" rx="8" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
    <text x="370" y="203" fill="#e2e8f0" font-size="12.5">檢視者（Viewer）</text>
    <path d="M590 195 l8 8 l8 -8" fill="none" stroke="#8894b0" stroke-width="2"/>
  </g>

  <!-- arrow to key -->
  <line x1="640" y1="140" x2="700" y2="140" stroke="#4a5680" stroke-width="2"/>
  <polygon points="700,140 688,133 688,147" fill="#4a5680"/>

  <!-- right: result -->
  <g>
    <rect x="705" y="90" width="155" height="100" rx="12" fill="#181c27" stroke="#22c55e" stroke-width="2"/>
    <path d="M745 145 l14 14 l24 -28" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="782" y="176" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">API 可讀取</text>
  </g>

  <text x="450" y="264" text-anchor="middle" fill="#8894b0" font-size="12.5">兩份表都要各自設定一次，否則系統會出現 403 錯誤</text>
</svg>
