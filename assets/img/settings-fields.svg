<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Sans TC',sans-serif">
  <rect width="640" height="460" fill="#0f1117"/>
  <rect x="30" y="20" width="580" height="420" rx="16" fill="#1e2336" stroke="#3a4570" stroke-width="1.5"/>
  <text x="56" y="58" fill="#e2e8f0" font-size="17" font-weight="700">⚙️ Google Sheet 設定</text>
  <line x1="56" y1="72" x2="584" y2="72" stroke="#2a3050" stroke-width="1"/>

  <!-- API Key -->
  <text x="56" y="100" fill="#8894b0" font-size="12">Google API Key</text>
  <rect x="56" y="108" width="528" height="36" rx="7" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
  <text x="70" y="131" fill="#4a5680" font-size="13" font-family="monospace">AIzaSy••••••••••••••••••••••</text>

  <!-- staff sheet id -->
  <text x="56" y="170" fill="#8894b0" font-size="12">師資調查表 — 網址或 ID</text>
  <rect x="56" y="178" width="528" height="36" rx="7" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
  <text x="70" y="201" fill="#4a5680" font-size="12.5" font-family="monospace">https://docs.google.com/spreadsheets/d/1AbC.../edit</text>

  <text x="56" y="234" fill="#8894b0" font-size="12">師資調查表 — 分頁名稱</text>
  <rect x="56" y="242" width="528" height="36" rx="7" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
  <text x="70" y="265" fill="#e2e8f0" font-size="13">2026夏令營</text>

  <!-- schedule sheet id -->
  <text x="56" y="298" fill="#8894b0" font-size="12">需求表 — 網址或 ID</text>
  <rect x="56" y="306" width="528" height="36" rx="7" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
  <text x="70" y="329" fill="#4a5680" font-size="12.5" font-family="monospace">https://docs.google.com/spreadsheets/d/1XyZ.../edit</text>

  <text x="56" y="362" fill="#8894b0" font-size="12">需求表 — 分頁名稱</text>
  <rect x="56" y="370" width="528" height="36" rx="7" fill="#181c27" stroke="#2a3050" stroke-width="1.5"/>
  <text x="70" y="393" fill="#e2e8f0" font-size="13">2026 夏令營</text>

  <!-- save button -->
  <rect x="466" y="414" width="118" height="34" rx="8" fill="#4f8ef7"/>
  <text x="525" y="436" text-anchor="middle" fill="#0f1117" font-size="13" font-weight="700">儲存</text>

  <text x="56" y="436" fill="#4a5680" font-size="11">設定只存在這個瀏覽器（localStorage），不會上傳</text>
</svg>
