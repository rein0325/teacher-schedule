<svg viewBox="0 0 960 220" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Noto Sans TC',sans-serif">
  <rect width="960" height="220" fill="#0f1117"/>

  <line x1="180" y1="100" x2="780" y2="100" stroke="#2a3050" stroke-width="3" stroke-dasharray="2 7"/>

  <!-- Step 1 -->
  <g>
    <rect x="60" y="40" width="240" height="120" rx="14" fill="#181c27" stroke="#4f8ef7" stroke-width="2"/>
    <circle cx="90" cy="70" r="16" fill="#4f8ef7"/>
    <text x="90" y="76" text-anchor="middle" fill="#0f1117" font-size="15" font-weight="700">1</text>
    <text x="112" y="76" fill="#e2e8f0" font-size="16" font-weight="700">匯入資料</text>
    <text x="90" y="105" fill="#8894b0" font-size="12">從 Google Sheet</text>
    <text x="90" y="123" fill="#8894b0" font-size="12">抓師資表 + 需求表</text>
    <text x="90" y="145" fill="#8894b0" font-size="12">（或上傳排課結果.xlsx）</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="360" y="40" width="240" height="120" rx="14" fill="#181c27" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="390" cy="70" r="16" fill="#a78bfa"/>
    <text x="390" y="76" text-anchor="middle" fill="#0f1117" font-size="15" font-weight="700">2</text>
    <text x="412" y="76" fill="#e2e8f0" font-size="16" font-weight="700">老師設定</text>
    <text x="390" y="105" fill="#8894b0" font-size="12">角色鎖定（只當講師/助教）</text>
    <text x="390" y="123" fill="#8894b0" font-size="12">新進人員助教保護週數</text>
    <text x="390" y="145" fill="#8894b0" font-size="12">設定完成後按「執行排班」</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="660" y="40" width="240" height="120" rx="14" fill="#181c27" stroke="#f97316" stroke-width="2"/>
    <circle cx="690" cy="70" r="16" fill="#f97316"/>
    <text x="690" y="76" text-anchor="middle" fill="#0f1117" font-size="15" font-weight="700">3</text>
    <text x="712" y="76" fill="#e2e8f0" font-size="16" font-weight="700">排班結果</text>
    <text x="690" y="105" fill="#8894b0" font-size="12">點格子換人、補排缺額</text>
    <text x="690" y="123" fill="#8894b0" font-size="12">全部重新排班</text>
    <text x="690" y="145" fill="#8894b0" font-size="12">完成後匯出 Excel</text>
  </g>

  <polygon points="318,100 300,93 300,107" fill="#4a5680"/>
  <polygon points="618,100 600,93 600,107" fill="#4a5680"/>

  <text x="480" y="200" text-anchor="middle" fill="#4a5680" font-size="12">全部運算都在瀏覽器裡完成，資料不會上傳到任何第三方伺服器</text>
</svg>
